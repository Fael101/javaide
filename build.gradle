// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // AGP 3.1.3 is the last version that works with this project's Java 7 toolchain
        // and the vendored aapt/dx binaries. Newer AGP requires Java 8 source level.
        classpath 'com.android.tools.build:gradle:3.1.3'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}


ext {
    compileSdkVersion = 27
    buildToolsVersion = '27.0.3'
    targetSdkVersion = 27
    minSdkVersion = 14
    googleServiceVersion = "15.0.2"
    supportLibVersion = "27.1.1"
}

