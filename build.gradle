// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        google()
        mavenCentral()
        // repo.maven.apache.org has been answering 404 to Gradle 4.4's HTTP client for
        // artifacts that are definitely present (asm 5.1, kotlin-stdlib-jre8 1.2.0, both
        // required transitively by AGP 3.1.3). This Google-hosted mirror serves the same
        // bytes from a different host and is the fallback that actually resolves them.
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
    }
    dependencies {
        // AGP 3.1.3 is the last version that works with this project's Java 7 toolchain
        // and the vendored aapt/dx binaries. Newer AGP requires Java 8 source level.
        classpath 'com.android.tools.build:gradle:3.1.3'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
    }
}


ext {
    compileSdkVersion = 27
    buildToolsVersion = '27.0.3'
    targetSdkVersion = 27
    minSdkVersion = 14
    googleServiceVersion = "15.0.2"
    supportLibVersion = "27.1.1"
}

