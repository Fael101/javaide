apply plugin: 'com.android.library'

android {
    compileSdkVersion rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

}
dependencies {
    api project(':aosp:annotations')

    // This module is a partial fork of AGP's builder-model: 31 classes against 61 upstream.
    // AndroidArtifactOutput extends com.android.build.VariantOutput, which the fork does not
    // carry, so the upstream artifact supplies it. compileOnly keeps AGP's copies of the
    // com.android.builder.model.* classes out of the APK, where the fork's own versions win.
    compileOnly 'com.android.tools.build:builder-model:3.1.3'
}
